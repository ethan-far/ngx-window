name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Build library
              run: npm run build:lib

            - name: Test and check coverage
              run: npm run test:coverage

            - name: Inspect package candidate
              if: matrix.node-version == '24.x'
              run: npm pack ./dist/ngx-window --dry-run

            - name: Save tested npm package
              if: >-
                  matrix.node-version == '24.x' &&
                  github.event_name == 'push' &&
                  github.repository == 'ethan-far/ngx-window'
              uses: actions/upload-artifact@v4
              with:
                  name: npm-package
                  path: dist/ngx-window
                  if-no-files-found: error
                  retention-days: 1

    publish:
        needs: build
        if: >-
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            github.repository == 'ethan-far/ngx-window'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        concurrency:
            group: npm-publish
            cancel-in-progress: false
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Use Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x

            - name: Use npm with trusted publishing support
              run: npm install --global npm@11

            - name: Download tested npm package
              uses: actions/download-artifact@v4
              with:
                  name: npm-package
                  path: dist/ngx-window

            - name: Check whether this version needs publishing
              id: release
              run: node scripts/check-npm-release.cjs

            - name: Publish to npm
              if: steps.release.outputs.publish == 'true'
              run: npm publish ./dist/ngx-window --access public --tag "${{ steps.release.outputs.tag }}" --registry=https://registry.npmjs.org/
